        <div class="container">

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle active" href="#" role="button"
                            data-bs-toggle="dropdown" aria-expanded="false">Manage products</a>
                        <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="add-product-form.html">Add Product</a></li>
                        <li><a class="dropdown-item" href="add-product-image-form.html">Add Product Image</a></li>
                        <li><a class="dropdown-item" href="search-product-form.html">Search Product</a></li>
                        <li><a class="dropdown-item" href="view-all-products.html">View All Products</a></li>

                    <li class="nav-item"><a class="nav-link" href="customer-sign-in.html">Sign in</a></li>

                </ul>
            </div>
        </div>
    </nav>

    <header class="hero text-white py-4 py-lg-5">
        <div class="container">
            <h1 class="h2 fw-bold mb-0">Delete Product</h1>
            <p class="mb-0 mt-1 text-white-50">Permanently remove a product by its ID.</p>
        </div>
    </header>

    <main class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card form-card shadow-sm">
                    <div class="card-body p-4">
                        <form id="delete-form" onsubmit="return false;">
                            <div class="mb-3">
                                <label class="form-label" for="delete-productid">Product ID</label>
                                <input type="text" class="form-control" id="delete-productid">
                            </div>
                            <button type="button" class="btn btn-danger" onclick="removeProduct()">Delete</button>
                        </form>
                        <div id="delete-product-status" class="status alert alert-info mt-3" role="status"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
