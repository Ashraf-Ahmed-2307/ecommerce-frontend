<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Customer Sign In</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark store-navbar">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Ecommerce Store</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button"
                            data-bs-toggle="dropdown" aria-expanded="false">Manage products</a>
                        <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="add-product-form.html">Add Product</a></li>
                        <li><a class="dropdown-item" href="add-product-image-form.html">Add Product Image</a></li>
                        <li><a class="dropdown-item" href="search-product-form.html">Search Product</a></li>
                        <li><a class="dropdown-item" href="view-all-products.html">View All Products</a></li>
                        <li><a class="dropdown-item" href="update-product-form.html">Update Product Name</a></li>
                        <li><a class="dropdown-item" href="delete-product-form.html">Delete Product</a></li>
                        </ul>
                    </li>
                    <li class="nav-item"><a class="nav-link active" href="customer-sign-in.html">Sign in</a></li>
                    <li class="nav-item"><a class="nav-link" href="customer-sign-up.html">Sign up</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <header class="hero text-white py-4 py-lg-5">
        <div class="container">
            <h1 class="h2 fw-bold mb-0">Welcome back</h1>
            <p class="mb-0 mt-1 text-white-50">Sign in with your username and password.</p>
        </div>
    </header>

    <main class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-5">
                <div class="card form-card shadow-sm">
                    <div class="card-body p-4">
                        <form id="sign-in-form" onsubmit="signIn(); return false;">
                            <div class="mb-3">
                                <label class="form-label" for="signin-username">Username</label>
                                <input type="text" class="form-control" id="signin-username" name="username" autocomplete="username" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="signin-password">Password</label>
                                <input type="password" class="form-control" id="signin-password" name="password" autocomplete="current-password" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Sign in</button>
                        </form>
                        <div id="sign-in-status" class="status alert alert-info mt-3" role="status"></div>
                        <p class="text-center text-muted mb-0 mt-3">New customer? <a href="customer-sign-up.html">Create an account</a></p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/custom.js"></script>
</body>

</html>
